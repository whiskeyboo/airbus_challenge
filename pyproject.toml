[project]
name = "airbus-challenge"
version = "0.1.0"
description = "Predictive airport capacity (AAR proxy) and severe delay risk, 3-12 h ahead"
authors = [
    { name = "whiskeyboo", email = "120105772+whiskeyboo@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "gdown>=6.5.1",
    "lightgbm>=4.7.0",
    "openai>=3.42.0",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
