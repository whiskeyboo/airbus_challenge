# Assumed single runway heading per airport (challenge brief). The reciprocal is heading + 180.
# Heading reference (true vs magnetic) is unspecified in the brief; METAR wind is true north (docs/DECISIONS.md O03).
airports:
  KATL:
    iata: ATL
    runway_heading_deg: 80
    timezone: America/New_York
    iem_station: ATL  # IEM METAR station id; the IEM TAF endpoint is queried by ICAO
  KDFW:
    iata: DFW
    runway_heading_deg: 180
    timezone: America/Chicago
    iem_station: DFW
