# Single source of truth for splits and targets. Airports and headings live in airports.yaml.
seed: 42
horizons_h: [3, 6, 9, 12]

targets:
  # Realised arrivals (BTS wheels-on) per UTC hour. NOT official AAR; label "arrival throughput (AAR proxy)".
  throughput: reporting_carrier_touchdowns
  # Ratio of throughput to the airport-hour clear-weather ceiling (95th pct, fitted on train only). Experimental.
  capacity_ratio: throughput_over_clear_weather_p95
  # Departure delay strictly > 45 min, among operated flights only. Cancelled = excluded, not negative.
  severe_delay: departure_delay_gt45
  severe_delay_threshold_min: 45
  cancellation: reported_separately

# Half-open [start, end) UTC, partitioned on target time. Provided CSV ends 2025-07-31.
splits:
  train:       {start: "2023-01-01", end: "2024-01-01"}
  validation:  {start: "2024-01-01", end: "2024-07-01"}
  calibration: {start: "2024-07-01", end: "2025-01-01"}
  test:        {start: "2025-01-01", end: "2025-08-01"}
leave_one_airport_out: true

# PROPOSED, not validated (docs/DECISIONS.md P10). Benign hours for the clear-weather ceiling, judged on METAR.
clear_weather:
  min_ceiling_ft: 3000  # An hour with no ceiling also qualifies.
  min_visibility_sm: 5
  allow_weather_codes: false

# Resolved from the brief: see docs/DECISIONS.md (O01-O04).
supplemental_data_permission: in_scope_per_brief
